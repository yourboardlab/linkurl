<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>바로가기 시작페이지</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="body-bg">
  <div class="wrap">
    <header class="header">
      <h1>바로가기</h1>
      <div class="search">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" placeholder="검색하거나 URL 입력 후 Enter" autofocus autocomplete="off" />
        </div>
      </div>
      <div class="controls">
        <div class="theme-panel">
          <select id="skinSelect" class="theme-select" title="스킨 선택">
            <option value="default">Default</option>
            <option value="midnight">Midnight</option>
            <option value="mint">Mint</option>
            <option value="sunset">Sunset</option>
          </select>
        </div>
        <div class="actions">
          <button id="addGroupBtn" class="btn primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            새 그룹
          </button>
          <button id="exportBtn" class="btn ghost">내보내기</button>
          <button id="importBtn" class="btn ghost">불러오기</button>
          <button id="resetBtn" class="btn danger">초기화</button>
        </div>
      </div>
    </header>

    <main>
      <div id="groups"></div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 class="modal-title"></h3>
      <div class="modal-fields"></div>
      <div class="modal-actions"></div>
    </div>
  </div>

  <script>
    const defaultLinks = [
      { title: 'Google', url: 'https://www.google.com' },
      { title: 'Gmail', url: 'https://mail.google.com' },
      { title: 'GitHub', url: 'https://github.com' }
    ];

    const defaultGroups = [
      { name: 'General', collapsed: false, links: defaultLinks.slice() }
    ];

    const skinPresets = {
      default:  { '--bg':'#f4f6f8','--bg-2':'#eef2f7','--card':'#ffffff','--accent':'#2563eb','--accent-rgb':'37,99,235','--muted':'#6b7280','--text':'#0f172a','--border':'rgba(15,23,42,0.10)','--glass':'rgba(255,255,255,0.6)' },
      midnight: { '--bg':'#0f172a','--bg-2':'#0b1324','--card':'#141d33','--accent':'#8b5cf6','--accent-rgb':'139,92,246','--muted':'#94a3b8','--text':'#e6eef8','--border':'rgba(255,255,255,0.10)','--glass':'rgba(255,255,255,0.06)' },
      mint:     { '--bg':'#eefcf6','--bg-2':'#e2f9f1','--card':'#ffffff','--accent':'#0ea5a4','--accent-rgb':'14,165,164','--muted':'#4b5563','--text':'#06323a','--border':'rgba(6,50,58,0.10)','--glass':'rgba(255,255,255,0.6)' },
      sunset:   { '--bg':'#fff7ed','--bg-2':'#ffedd9','--card':'#ffffff','--accent':'#ff7a59','--accent-rgb':'255,122,89','--muted':'#7c5a4a','--text':'#2b1f1a','--border':'rgba(43,31,26,0.10)','--glass':'rgba(255,255,255,0.6)' }
    };

    function loadGroups(){
      return JSON.parse(localStorage.getItem('groups') || 'null') || defaultGroups.slice();
    }

    function saveGroups(groups){
      localStorage.setItem('groups', JSON.stringify(groups));
      pushToServer(groups);
    }

    /* ---------- Shared server sync (same-PC, multiple Chrome profiles) ---------- */
    function pushToServer(groups){
      fetch('/api/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(groups)
      }).catch(()=>{ /* server not running / opened as a plain file - stay local-only */ });
    }

    async function pullFromServer(){
      try{
        const res = await fetch('/api/data', { cache: 'no-store' });
        if(!res.ok) return 'unreachable';
        const payload = await res.json();
        if(!payload || !Array.isArray(payload.groups)) return 'unreachable';
        if(payload.groups.length === 0) return 'empty';
        const incoming = JSON.stringify(payload.groups);
        if(incoming === localStorage.getItem('groups')) return 'same';
        localStorage.setItem('groups', incoming);
        return 'updated';
      }catch(e){
        return 'unreachable';
      }
    }

    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]); }

    function normalizeUrl(u){
      u = u.trim();
      if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
      return u;
    }

    function getHost(url){
      try{ return new URL(url).host; }catch(e){ return url; }
    }

    function getFavicon(url){
      try{ return `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(new URL(url).host)}`; }
      catch(e){ return ''; }
    }

    /* ---------- Modal ---------- */
    function openModal({title, message, fields = [], confirmLabel = '확인', cancelLabel = '취소', hideCancel = false, danger = false, extraButton = null, wide = false}){
      return new Promise(resolve => {
        const overlay = document.getElementById('modalOverlay');
        const modal = overlay.querySelector('.modal');
        modal.classList.toggle('wide', wide);
        modal.querySelector('.modal-title').textContent = title;
        const fieldsWrap = modal.querySelector('.modal-fields');
        fieldsWrap.innerHTML =
          (message ? `<p class="modal-message">${escapeHtml(message)}</p>` : '') +
          fields.map(f => `
            <label class="modal-field" data-name="${f.name}">
              <span>${escapeHtml(f.label)}</span>
              ${f.type === 'textarea'
                ? `<textarea name="${f.name}" rows="${f.rows || 2}" placeholder="${escapeHtml(f.placeholder || '')}" ${f.readonly ? 'readonly' : ''}>${escapeHtml(f.value || '')}</textarea>`
                : `<input type="text" name="${f.name}" placeholder="${escapeHtml(f.placeholder || '')}" value="${escapeHtml(f.value || '')}" ${f.readonly ? 'readonly' : ''} />`}
            </label>
          `).join('');

        const actionsWrap = modal.querySelector('.modal-actions');
        actionsWrap.innerHTML =
          (extraButton ? `<button class="btn ghost" data-action="extra">${escapeHtml(extraButton.label)}</button>` : '') +
          (hideCancel ? '' : `<button class="btn ghost" data-action="cancel">${escapeHtml(cancelLabel)}</button>`) +
          `<button class="btn ${danger ? 'danger' : 'primary'}" data-action="confirm">${escapeHtml(confirmLabel)}</button>`;

        const confirmBtn = actionsWrap.querySelector('[data-action="confirm"]');
        const cancelBtn = actionsWrap.querySelector('[data-action="cancel"]');
        const extraBtn = actionsWrap.querySelector('[data-action="extra"]');

        overlay.classList.add('open');
        const firstInput = fieldsWrap.querySelector('input:not([readonly]), textarea:not([readonly])');
        const focusTarget = firstInput || fieldsWrap.querySelector('input, textarea') || confirmBtn;
        setTimeout(() => focusTarget.focus(), 10);

        function cleanup(){
          overlay.classList.remove('open');
          overlay.removeEventListener('mousedown', onOverlayClick);
          modal.removeEventListener('keydown', onKeydown);
          confirmBtn.removeEventListener('click', onConfirm);
          if(cancelBtn) cancelBtn.removeEventListener('click', onCancel);
          if(extraBtn) extraBtn.removeEventListener('click', onExtra);
        }
        function finish(result){ cleanup(); resolve(result); }

        function collect(){
          const data = {};
          let ok = true;
          fieldsWrap.querySelectorAll('.modal-field').forEach(label => {
            const name = label.dataset.name;
            const input = label.querySelector('input, textarea');
            const val = input.value.trim();
            const spec = fields.find(f => f.name === name);
            if(spec && spec.required && !val){
              label.classList.add('error');
              ok = false;
            } else {
              label.classList.remove('error');
            }
            data[name] = val;
          });
          return { ok, data };
        }

        function onConfirm(){
          const { ok, data } = collect();
          if(!ok) return;
          finish(fields.length ? data : true);
        }
        function onCancel(){ finish(fields.length ? null : false); }
        function onExtra(){
          const { data } = collect();
          if(extraButton.keepOpen){ extraButton.onClick(data, fieldsWrap); }
          else { finish(extraButton.value !== undefined ? extraButton.value : data); }
        }
        function onOverlayClick(e){ if(e.target === overlay) onCancel(); }
        function onKeydown(e){
          if(e.key === 'Escape') onCancel();
          if(e.key === 'Enter' && e.target.tagName === 'INPUT') onConfirm();
        }

        confirmBtn.addEventListener('click', onConfirm);
        if(cancelBtn) cancelBtn.addEventListener('click', onCancel);
        if(extraBtn) extraBtn.addEventListener('click', onExtra);
        overlay.addEventListener('mousedown', onOverlayClick);
        modal.addEventListener('keydown', onKeydown);
      });
    }

    function alertDialog(title, message){
      return openModal({ title, message, fields: [], confirmLabel: '확인', hideCancel: true });
    }

    function confirmDialog(title, message){
      return openModal({ title, message, fields: [], confirmLabel: '삭제', danger: true });
    }

    /* ---------- Render ---------- */
    function render(){
      const container = document.getElementById('groups');
      const groups = loadGroups();

      if(groups.length === 0){
        container.innerHTML = `
          <div class="empty-state">
            <p>아직 그룹이 없어요. 새 그룹을 만들어 바로가기를 정리해보세요.</p>
            <button class="btn primary" id="emptyAddGroup">새 그룹 만들기</button>
          </div>`;
        document.getElementById('emptyAddGroup').addEventListener('click', () => document.getElementById('addGroupBtn').click());
        return;
      }

      container.innerHTML = groups.map((g,gi)=>`
        <section class="group ${g.collapsed ? 'collapsed' : ''}" data-gi="${gi}">
          <div class="group-header" data-gi="${gi}">
            <span class="drag-handle" title="드래그하여 순서 변경" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
            </span>
            <button class="toggle" data-gi="${gi}" aria-expanded="${!g.collapsed}" aria-label="펼치기/접기">
              <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="group-title" contenteditable spellcheck="false" data-gi="${gi}">${escapeHtml(g.name)}</div>
            <span class="group-count">${g.links.length}</span>
            <div class="group-actions">
              <button class="btn ghost small add-link" data-gi="${gi}">+ 바로가기</button>
              <button class="btn ghost small rm-group" data-gi="${gi}" title="그룹 삭제">삭제</button>
            </div>
          </div>
          <div class="group-body-outer">
            <div class="group-body-inner">
              <div class="group-body">
                <div class="grid" data-gi="${gi}">
                  ${g.links.length === 0 ? `<div class="group-empty">이 그룹에는 아직 바로가기가 없어요. 다른 그룹의 카드를 여기로 끌어와도 돼요.</div>` : ''}
                  ${g.links.map((l,li)=>`
                    <div class="card" data-gi="${gi}" data-i="${li}">
                      <a class="link" href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer" draggable="false">
                        <img class="favicon" src="${getFavicon(l.url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'" />
                        <div class="card-text">
                          <div class="title">${escapeHtml(l.title)}</div>
                          <div class="url">${escapeHtml(getHost(l.url))}</div>
                          ${l.desc ? `<div class="desc">${escapeHtml(l.desc)}</div>` : ''}
                        </div>
                      </a>
                      <div class="card-actions">
                        <button class="card-drag" title="드래그하여 이동" aria-hidden="true">
                          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
                        </button>
                        <button class="edit" data-gi="${gi}" data-i="${li}" title="수정">✎</button>
                        <button class="rm" data-gi="${gi}" data-i="${li}" title="삭제">×</button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        </section>
      `).join('');

      /* ---- Drag & drop: reorder groups, reorder/move cards ---- */
      let draggingGroup = null;
      let draggingCard = null;

      function commitOrderFromDOM(){
        const oldGroups = loadGroups();
        const newGroups = [...container.querySelectorAll('.group')].map(section => {
          const oldGroup = oldGroups[+section.dataset.gi];
          const grid = section.querySelector('.grid');
          const newLinks = [...grid.querySelectorAll('.card')].map(card =>
            oldGroups[+card.dataset.gi].links[+card.dataset.i]
          );
          return { name: oldGroup.name, collapsed: oldGroup.collapsed, links: newLinks };
        });
        saveGroups(newGroups);
      }

      container.querySelectorAll('.group').forEach(section=>{
        const handle = section.querySelector('.group-header .drag-handle');
        handle.addEventListener('mousedown', ()=>{ section.draggable = true; });
        section.addEventListener('dragstart', e=>{
          draggingGroup = section;
          section.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', 'group');
        });
        section.addEventListener('dragend', ()=>{
          section.classList.remove('dragging');
          section.draggable = false;
          draggingGroup = null;
          commitOrderFromDOM();
          render();
        });
        section.addEventListener('dragover', e=>{
          if(!draggingGroup || draggingGroup === section) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          const rect = section.getBoundingClientRect();
          const after = (e.clientY - rect.top) > rect.height/2;
          container.insertBefore(draggingGroup, after ? section.nextSibling : section);
        });
      });

      function cardAfterElement(grid, x, y){
        const cards = [...grid.querySelectorAll('.card:not(.card-dragging)')];
        for(const card of cards){
          const box = card.getBoundingClientRect();
          if(y < box.top) return card;
          if(y >= box.top && y <= box.bottom){
            return x < box.left + box.width/2 ? card : card.nextElementSibling;
          }
        }
        return null;
      }

      container.querySelectorAll('.card').forEach(card=>{
        const handle = card.querySelector('.card-drag');
        handle.addEventListener('mousedown', e=>{ e.stopPropagation(); card.draggable = true; });
        card.addEventListener('dragstart', e=>{
          e.stopPropagation();
          draggingCard = card;
          card.classList.add('card-dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', 'card');
        });
        card.addEventListener('dragend', e=>{
          e.stopPropagation();
          card.classList.remove('card-dragging');
          card.draggable = false;
          draggingCard = null;
          commitOrderFromDOM();
          render();
        });
      });

      container.querySelectorAll('.grid').forEach(grid=>{
        grid.addEventListener('dragover', e=>{
          if(!draggingCard) return;
          e.preventDefault();
          e.stopPropagation();
          e.dataTransfer.dropEffect = 'move';
          const after = cardAfterElement(grid, e.clientX, e.clientY);
          if(after == null) grid.appendChild(draggingCard);
          else if(after !== draggingCard) grid.insertBefore(draggingCard, after);
        });
        grid.addEventListener('drop', e=>e.preventDefault());
      });

      // Toggle whole group by clicking header (excluding action buttons / title editing)
      container.querySelectorAll('.group-header').forEach(header=>{
        header.addEventListener('click', e=>{
          if(e.target.closest('.group-actions')) return;
          if(e.target.closest('.group-title')) return;
          if(e.target.closest('.drag-handle')) return;
          const gi = +header.dataset.gi;
          const section = header.closest('.group');
          const groups = loadGroups();
          groups[gi].collapsed = !groups[gi].collapsed;
          saveGroups(groups);
          section.classList.toggle('collapsed', groups[gi].collapsed);
          section.querySelector('.toggle').setAttribute('aria-expanded', String(!groups[gi].collapsed));
        });
      });

      container.querySelectorAll('.add-link').forEach(b=>b.addEventListener('click', async e=>{
        e.stopPropagation();
        const gi = +e.currentTarget.dataset.gi;
        const data = await openModal({
          title: '바로가기 추가',
          confirmLabel: '추가',
          fields: [
            { name:'title', label:'이름', placeholder:'예: GitHub', required:true },
            { name:'url', label:'URL', placeholder:'example.com', required:true },
            { name:'desc', label:'설명 (선택)', placeholder:'예: 코드 저장소', type:'textarea' }
          ]
        });
        if(!data) return;
        const groups = loadGroups();
        groups[gi].links.unshift({ title:data.title, url:normalizeUrl(data.url), desc:data.desc || '' });
        saveGroups(groups);
        render();
      }));

      container.querySelectorAll('.rm-group').forEach(b=>b.addEventListener('click', async e=>{
        e.stopPropagation();
        const gi = +e.currentTarget.dataset.gi;
        const groups = loadGroups();
        const ok = await confirmDialog('그룹 삭제', `"${groups[gi].name}" 그룹과 그 안의 바로가기를 모두 삭제할까요?`);
        if(!ok) return;
        groups.splice(gi,1);
        saveGroups(groups);
        render();
      }));

      container.querySelectorAll('.card .rm').forEach(b=>b.addEventListener('click', async e=>{
        e.stopPropagation();
        const gi = +e.currentTarget.dataset.gi;
        const i = +e.currentTarget.dataset.i;
        const groups = loadGroups();
        const ok = await confirmDialog('바로가기 삭제', `"${groups[gi].links[i].title}"을(를) 삭제할까요?`);
        if(!ok) return;
        groups[gi].links.splice(i,1);
        saveGroups(groups);
        render();
      }));

      container.querySelectorAll('.card .edit').forEach(b=>b.addEventListener('click', async e=>{
        e.stopPropagation();
        const gi = +e.currentTarget.dataset.gi;
        const i = +e.currentTarget.dataset.i;
        const groups = loadGroups();
        const item = groups[gi].links[i];
        const data = await openModal({
          title: '바로가기 수정',
          confirmLabel: '저장',
          fields: [
            { name:'title', label:'이름', value:item.title, required:true },
            { name:'url', label:'URL', value:item.url, required:true },
            { name:'desc', label:'설명 (선택)', value:item.desc || '', type:'textarea' }
          ]
        });
        if(!data) return;
        groups[gi].links[i] = { title:data.title, url:normalizeUrl(data.url), desc:data.desc || '' };
        saveGroups(groups);
        render();
      }));

      container.querySelectorAll('.card .link').forEach(a=>a.addEventListener('click', e=>e.stopPropagation()));

      container.querySelectorAll('.group-title').forEach(el=>{
        el.addEventListener('click', e=>e.stopPropagation());
        el.addEventListener('keydown', e=>{
          if(e.key === 'Enter'){ e.preventDefault(); el.blur(); }
        });
        el.addEventListener('blur', e=>{
          const gi = +e.currentTarget.dataset.gi;
          const groups = loadGroups();
          const val = e.currentTarget.textContent.trim() || '그룹';
          groups[gi].name = val;
          saveGroups(groups);
          render();
        });
      });
    }

    /* ---------- Theme ---------- */
    function applyTheme(name){
      const root = document.documentElement;
      const preset = skinPresets[name] || skinPresets.default;
      Object.entries(preset).forEach(([k,v])=>root.style.setProperty(k, v));
      localStorage.setItem('skin', JSON.stringify({name}));
    }

    (function(){
      try{
        const stored = JSON.parse(localStorage.getItem('skin') || localStorage.getItem('theme') || 'null');
        if(stored){
          applyTheme(stored.name || 'default');
          const sel = document.getElementById('skinSelect');
          if(sel) sel.value = stored.name || 'default';
        } else {
          applyTheme('default');
        }
      }catch(e){applyTheme('default')}
    })();

    document.getElementById('skinSelect').addEventListener('change', e=>{
      applyTheme(e.target.value);
    });

    document.getElementById('addGroupBtn').addEventListener('click', async ()=>{
      const data = await openModal({
        title: '새 그룹',
        confirmLabel: '만들기',
        fields: [ { name:'name', label:'그룹 이름', placeholder:'예: 업무', required:true } ]
      });
      if(!data) return;
      const groups = loadGroups();
      groups.unshift({ name:data.name, collapsed:false, links:[] });
      saveGroups(groups);
      render();
    });

    document.getElementById('resetBtn').addEventListener('click', async ()=>{
      const ok = await confirmDialog('초기화', '로컬에 저장된 모든 그룹과 바로가기를 초기화합니다. 계속할까요?');
      if(!ok) return;
      localStorage.removeItem('groups');
      render();
    });

    document.getElementById('q').addEventListener('keydown', e=>{
      if(e.key !== 'Enter') return;
      const v = e.target.value.trim();
      if(!v) return;
      const isUrl = /^https?:\/\//i.test(v) || /^[\w-]+\.[a-z]{2,}(\/.*)?$/i.test(v);
      if(isUrl) window.location.href = normalizeUrl(v);
      else window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(v);
    });

    // Safety net: if a drag handle is pressed but no actual drag occurs,
    // make sure the element doesn't stay draggable afterwards.
    document.addEventListener('mouseup', ()=>{
      document.querySelectorAll('[draggable="true"]').forEach(el => { el.draggable = false; });
    });

    /* ---------- Export / Import (plain text) ---------- */
    function groupsToText(groups){
      return groups.map(g => {
        const lines = [`# ${g.name}`];
        g.links.forEach(l => {
          lines.push(`${l.title} - ${l.url}` + (l.desc ? ` : ${l.desc}` : ''));
        });
        return lines.join('\n');
      }).join('\n\n');
    }

    function textToGroups(text){
      const groups = [];
      let current = null;
      text.split(/\r?\n/).forEach(raw => {
        const line = raw.trim();
        if(!line) return;
        const groupMatch = line.match(/^#\s*(.+)$/);
        if(groupMatch){
          current = { name: groupMatch[1].trim(), collapsed:false, links:[] };
          groups.push(current);
          return;
        }
        const linkMatch = line.match(/^(.+?)\s*-\s*(https?:\/\/\S+)(?:\s*:\s*(.*))?$/i);
        if(linkMatch){
          if(!current){ current = { name:'가져온 그룹', collapsed:false, links:[] }; groups.push(current); }
          current.links.push({ title: linkMatch[1].trim(), url: linkMatch[2].trim(), desc: (linkMatch[3] || '').trim() });
        }
      });
      return groups;
    }

    document.getElementById('exportBtn').addEventListener('click', async ()=>{
      const text = groupsToText(loadGroups());
      await openModal({
        title: '내보내기',
        message: '아래 텍스트를 복사해서 보관하거나 다른 기기에서 불러오세요.',
        confirmLabel: '닫기',
        hideCancel: true,
        wide: true,
        fields: [ { name:'data', label:'내보내기 텍스트', type:'textarea', rows:12, value:text, readonly:true } ],
        extraButton: {
          label: '복사',
          keepOpen: true,
          onClick: async (data, fieldsWrap) => {
            try{
              await navigator.clipboard.writeText(text);
              const btn = fieldsWrap.parentElement.querySelector('[data-action="extra"]');
              const original = btn.textContent;
              btn.textContent = '복사됨!';
              setTimeout(()=>{ btn.textContent = original; }, 1200);
            }catch(e){
              const ta = fieldsWrap.querySelector('textarea');
              ta.focus();
              ta.select();
            }
          }
        }
      });
    });

    document.getElementById('importBtn').addEventListener('click', async ()=>{
      const data = await openModal({
        title: '불러오기',
        message: '아래 형식으로 붙여넣으세요.\n# 그룹명\n이름 - https://url : 설명(선택)',
        confirmLabel: '가져오기',
        wide: true,
        fields: [ { name:'data', label:'가져오기 텍스트', type:'textarea', rows:12, placeholder:'# General\nGoogle - https://www.google.com : 검색엔진' } ]
      });
      if(!data || !data.data) return;
      const parsed = textToGroups(data.data);
      if(parsed.length === 0){
        await alertDialog('가져오기 실패', '인식할 수 있는 그룹이나 바로가기가 없어요. 형식을 확인해주세요.');
        return;
      }
      const choice = await openModal({
        title: '가져오기 방식',
        message: `${parsed.length}개 그룹을 찾았어요. 기존 그룹은 어떻게 할까요?`,
        confirmLabel: '전체 교체',
        danger: true,
        cancelLabel: '취소',
        extraButton: { label: '기존에 추가', value: 'merge' }
      });
      if(!choice) return;
      if(choice === 'merge'){
        saveGroups(loadGroups().concat(parsed));
      } else {
        saveGroups(parsed);
      }
      render();
    });

    // On load: adopt the server's shared data if it has any; otherwise seed the
    // server with whatever this profile already has (first-run bootstrap).
    (async function bootstrap(){
      const status = await pullFromServer();
      if(status === 'empty') pushToServer(loadGroups());
      render();
    })();

    // When switching back to this tab/profile, pick up changes saved elsewhere.
    document.addEventListener('visibilitychange', async ()=>{
      if(document.visibilityState !== 'visible') return;
      const status = await pullFromServer();
      if(status === 'updated') render();
    });
  </script>
</body>
</html>
